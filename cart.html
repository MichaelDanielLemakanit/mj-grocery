<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - MJ Grocery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    .navbar{
        display: flex;
        justify-content: center;
        position: fixed top;
        padding: 20px;
        background-color: #157347;
        color: white;

    }
    .nav-link-custom {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            display: inline-block;
            transition: 0.3s;
        }
    .nav-link-custom:hover { 
        color: rgb(255, 230, 0);
    }
    
</style>
<body>
    <section class="navbar">
        <!-- logo -->
        <div class="col-6 col-md-3 d-flex align-items-center">
            <div class="bg-warning text-dark p-2 rounded-circle me-2 d-none d-sm-block">
                <i class="bi bi-basket-fill"></i>
            </div>
            <span class="logo-text">MJ Grocery</span>
        </div>
        <!-- navbar -->
        <div class="col-md-9">
            <div class="d-flex flex-column flex-md-row">
                <a href="index.html" class="nav-link-custom">Home</a>
                <a href="admin-login.html" class="nav-link-custom">Shop</a>
                <a href="fruits.html" class="nav-link-custom">Fruits</a>
                <a href="vegitable.html" class="nav-link-custom">Vegetables</a>
                <a href="#" class="nav-link-custom">About</a>
            </div>
        </div>
    </section>
<div class="bg-light">

<div class="container my-5">
    <h2 class="mb-4">🛒 Your Cart</h2>
    <div id="cartItems" class="row"></div>

    <div class="text-end mt-4">
        <h4>Total: KSh <span id="totalPrice">0</span></h4>
        <button class="btn btn-success btn-lg px-5">Proceed to Checkout</button>
    </div>
</div>
</div>

<script>
function loadCart() {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let html = '';
    let total = 0;

    if (cart.length === 0) {
        html = `<p class="text-center">Your cart is empty.</p>`;
    } else {
        cart.forEach((item, index) => {
            total += item.price;
            html += `
                <div class="col-12 mb-3">
                    <div class="card">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <h6>${item.name}</h6>
                                <small>${item.unit}</small>
                            </div>
                            <div class="text-end">
                                <h5>KSh ${item.price}</h5>
                                <button class="btn btn-sm btn-danger" onclick="removeFromCart(${index})">Remove</button>
                            </div>
                        </div>
                    </div>
                </div>`;
        });
    }

    document.getElementById('cartItems').innerHTML = html;
    document.getElementById('totalPrice').textContent = total;
}

function removeFromCart(index) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    loadCart();
}

loadCart();
</script>
</body>
</html>
