<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - MJ Grocery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">
    <h2 class="mb-4">🛒 Your Cart</h2>
    <div id="cartItems" class="row"></div>

    <div class="text-end mt-4">
        <h4>Total: KSh <span id="totalPrice">0</span></h4>
        <button class="btn btn-success btn-lg px-5">Proceed to Checkout</button>
    </div>
</div>

<script>
function loadCart() {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let html = '';
    let total = 0;

    if (cart.length === 0) {
        html = `<p class="text-center">Your cart is empty.</p>`;
    } else {
        cart.forEach((item, index) => {
            total += item.price;
            html += `
                <div class="col-12 mb-3">
                    <div class="card">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <h6>${item.name}</h6>
                                <small>${item.unit}</small>
                            </div>
                            <div class="text-end">
                                <h5>KSh ${item.price}</h5>
                                <button class="btn btn-sm btn-danger" onclick="removeFromCart(${index})">Remove</button>
                            </div>
                        </div>
                    </div>
                </div>`;
        });
    }

    document.getElementById('cartItems').innerHTML = html;
    document.getElementById('totalPrice').textContent = total;
}

function removeFromCart(index) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    loadCart();
}

loadCart();
</script>
</body>
</html>
