<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MJ Grocery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #157347, #0f5c3a);
            height: 100vh;
        }
        .login-card {
            max-width: 420px;
            margin: 80px auto;
        }
        button{
            background-color: #0f5c3a;
            margin-top: 5px;
            border-radius: 10px;
            border: none;
        }
        button:hover{
            transition: ease-in 3ss;
            background-color: rgb(248, 232, 1);
        }
        button a{
            padding:7px;
            text-decoration: none;
            color: white;
        }
    </style>
</head>
<body class="d-flex align-items-center">

<div class="container">
    <div class="login-card card shadow">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h2 class="text-success"><i class="bi bi-basket-fill"></i> MJ Grocery</h2>
                <h5>Admin Login</h5>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Username or Email</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-success w-100 py-3">Login</button>
            </form>

            <div class="text-center mt-3">
                <a href="#" class="text-success" data-bs-toggle="modal" data-bs-target="#forgotModal">
                    Forgot Password?
                </a>
            </div>
            <div class="btn d-flex justify-content-center">
                <button><a href="index.html">home</a></button>
            </div>
        </div>
    </div>
</div>

<!-- Forgot Password Modal -->
<div class="modal fade" id="forgotModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Reset Password</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="step1">
                    <p>Enter your registered email or phone number</p>
                    <input type="text" class="form-control mb-3" id="resetContact" placeholder="email@example.com or +254712345678" required>
                    <button class="btn btn-success w-100" onclick="sendResetCode()">Send Reset Code</button>
                </div>

                <div id="step2" class="d-none">
                    <p>Enter the 6-digit code sent to you</p>
                    <input type="text" class="form-control mb-3 text-center" id="resetCode" placeholder="123456" maxlength="6">
                    <button class="btn btn-success w-100" onclick="verifyCode()">Verify Code</button>
                </div>

                <div id="step3" class="d-none">
                    <p>Create New Password</p>
                    <input type="password" class="form-control mb-3" id="newPassword" placeholder="New Password">
                    <input type="password" class="form-control mb-3" id="confirmPassword" placeholder="Confirm Password">
                    <button class="btn btn-success w-100" onclick="resetPassword()">Reset Password</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Simulate current admin (In production, this will be handled by backend)
let currentAdmin = {
    username: "admin",
    email: "admin@mjgrocery.com",
    phone: "+254712345678",
    password: "admin123"
};

document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const input = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;

    if ((input === currentAdmin.username || input === currentAdmin.email) && pass === currentAdmin.password) {
        localStorage.setItem('adminLoggedIn', 'true');
        window.location.href = 'admin.html';
    } else {
        alert("Invalid credentials!");
    }
});

function sendResetCode() {
    const contact = document.getElementById('resetContact').value.trim();
    if (!contact) return alert("Please enter email or phone number");

    // Send to backend
    fetch('/api/admin/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contact: contact })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            alert(`✅ Reset code sent to ${contact}`);
            document.getElementById('step1').classList.add('d-none');
            document.getElementById('step2').classList.remove('d-none');
        } else {
            alert(data.message || "Failed to send code");
        }
    })
    .catch(() => alert("Server error. Try again."));
}

function verifyCode() {
    const code = document.getElementById('resetCode').value.trim();
    fetch('/api/admin/verify-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            document.getElementById('step2').classList.add('d-none');
            document.getElementById('step3').classList.remove('d-none');
        } else {
            alert("Invalid or expired code");
        }
    });
}

function resetPassword() {
    const newPass = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;

    if (newPass.length < 6) return alert("Password must be at least 6 characters");
    if (newPass !== confirm) return alert("Passwords do not match!");

    fetch('/api/admin/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ newPassword: newPass })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            alert("✅ Password reset successful!");
            bootstrap.Modal.getInstance(document.getElementById('forgotModal')).hide();
            location.reload();
        }
    });
}
</script>
</body>
</html>
