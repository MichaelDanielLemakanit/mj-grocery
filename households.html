<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruits - MJ Grocery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        .product-card { transition: all 0.3s; }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .product-img { height: 200px; object-fit: contain; background: #f8f9fa; }
        /* navbar */
        .navbar{
        display: flex;
        justify-content: center;
        position: fixed top;
        padding: 20px;
        background-color: #157347;
        color: white;

    }
    .nav-link-custom {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            display: inline-block;
            transition: 0.3s;
        }
    .nav-link-custom:hover { 
        color: rgb(255, 230, 0);
    }
    </style>
</head>
<body>
    <!-- navbar -->
    <section class="navbar">
        <!-- logo -->
        <div class="col-6 col-md-3 d-flex align-items-center">
            <div class="bg-warning text-dark p-2 rounded-circle me-2 d-none d-sm-block">
                <i class="bi bi-basket-fill"></i>
            </div>
            <span class="logo-text">MJ Grocery</span>
        </div>
        <!-- navbar -->
        <div class="col-md-9">
            <div class="d-flex flex-column flex-md-row">
                <a href="index.html" class="nav-link-custom">Home</a>
                <a href="admin-login.html" class="nav-link-custom">Shop</a>
                <a href="fruits.html" class="nav-link-custom">Fruits</a>
                <a href="vegitable.html" class="nav-link-custom">Vegetables</a>
                <a href="index.html#About" class="nav-link-custom">About</a>
            </div>
        </div>
    </section>

    <!-- Include your Navbar here (copy from index.html) -->
    <!-- For simplicity, paste your full navbar code here -->

    <div class="container my-5">
        <h2 class="text-center fw-bold mb-5 text-success">🥕 Fresh Vegetables</h2>        <div class="row g-4" id="fruitsContainer"></div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Sample Fruits (You can later filter from admin products)
const fruits = [
    {id:1, name:"Fresh Strawberries", price:450, unit:"500g", img:"images/Fresh Strawberry.jpg"},
    {id:2, name:"Bananas", price:120, unit:"1 Bunch", img:"images/bananas.jpg"},
    {id:3, name:"Red Apples", price:380, unit:"1kg", img:"images/Red_Apple-removebg-preview (2).png"},
    {id:4, name:"Oranges", price:250, unit:"1kg", img:"images/oranges.jpg"},
    {id:5, name:"Avocado", price:180, unit:"4 pcs", img:"images/avacado.jpg"},
    {id:6, name:"Watermelon", price:450, unit:"1 pc", img:"images/watermelon.jpg"}
];

function addToCart(product) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    cart.push(product);
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartCount();
    alert(`${product.name} added to cart!`);
}

function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    document.getElementById('cartCount').textContent = cart.length;
}

document.getElementById('fruitsContainer').innerHTML = fruits.map(item => `
    <div class="col-md-4 col-lg-3 col-sm-6">
        <div class="product-card card h-100 text-center p-3">
            <img src="${item.img}" class="product-img card-img-top" alt="${item.name}">
            <div class="card-body">
                <h6 class="fw-bold">${item.name}</h6>
                <p class="text-muted">${item.unit}</p>
                <h5 class="text-success">KSh ${item.price}</h5>
                <button class="btn btn-success w-100 mt-2" onclick='addToCart(${JSON.stringify(item)})'>
                    Add to Cart
                </button>
            </div>
        </div>
    </div>
`).join('');

updateCartCount();
</script>
</body>
</html>
